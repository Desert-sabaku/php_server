services:
  apache:
    build: ./php
    container_name: apache
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:z
      - ./apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf:ro,z
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sample
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z

volumes:
  mysql_data:
